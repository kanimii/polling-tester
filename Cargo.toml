[package]
name = "polling-rate-checker"
version = "0.1.0"
edition = "2021"
description = "Measures mouse and keyboard polling rate on Windows"

[lib]
name = "prc"
path = "src/lib.rs"

[[bin]]
name = "PollingRateChecker"
path = "src/main.rs"

[[bin]]
name = "prc-dev"
path = "src/bin/prc_dev.rs"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
